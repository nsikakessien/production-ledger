services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Migrations run as the schema owner; the app itself connects as the
      # restricted ledger_app role (SELECT/INSERT only on ledger tables).
      ADMIN_DATABASE_URL: postgres://postgres:postgres@db:5432/ledger
      DATABASE_URL: postgres://ledger_app:ledger_app@db:5432/ledger
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "node dist/migrate.js && node dist/server.js"]

  test:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
    command: ["npx", "vitest", "run"]
